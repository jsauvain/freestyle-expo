name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Build web export
        run: npx expo export --platform web

      - name: Verify stock screen rendered into SSR HTML
        run: |
          set -e
          grep -q ">Bloom<" dist/index.html
          grep -q ">Awaiting first prompt\.<" dist/index.html
          echo "stock-screen text present in dist/index.html"
